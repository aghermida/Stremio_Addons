<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Configurar Nextcloud para Stremio</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
  p.hint { margin: 4px 0 0; font-size: 0.8rem; color: #666; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 1rem; }
  button { margin-top: 20px; padding: 10px 16px; font-size: 1rem; cursor: pointer; }
  #result { margin-top: 24px; padding: 12px; background: #f4f4f4; border-radius: 6px; word-break: break-all; display: none; }
  #result.visible { display: block; }
  #copy { margin-left: 8px; }
</style>
</head>
<body>
  <h1>Configurar Nextcloud para Stremio</h1>
  <p>Rellena tus datos de Nextcloud y obtén la URL de manifest para añadir como "Custom Addon" en AIOStreams.</p>

  <label for="url">URL de Nextcloud</label>
  <input id="url" type="url" placeholder="https://cloud.example.com" required />

  <label for="username">Usuario</label>
  <input id="username" type="text" required />

  <label for="password">Contraseña / token de aplicación</label>
  <input id="password" type="password" required />
  <p class="hint">Recomendado: Ajustes → Seguridad → Contraseñas de aplicación (Nextcloud).</p>

  <label for="folder">Carpeta</label>
  <input id="folder" type="text" value="/Stremio" required />

  <button id="generate">Generar URL de manifest</button>

  <div id="result">
    <strong>URL de manifest:</strong>
    <div id="manifestUrl"></div>
    <button id="copy">Copiar</button>
  </div>

  <script>
    function base64UrlEncode(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      bytes.forEach((b) => (binary += String.fromCharCode(b)));
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // This page is only reachable at /<accessKey>/ in the first place, so the
    // access key is just the current path's first segment.
    function getAccessKey() {
      return window.location.pathname.split('/').filter(Boolean)[0] || '';
    }

    document.getElementById('generate').addEventListener('click', () => {
      const config = {
        url: document.getElementById('url').value.replace(/\/$/, ''),
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        folder: document.getElementById('folder').value,
      };
      const encoded = base64UrlEncode(JSON.stringify(config));
      const manifestUrl = `${window.location.origin}/${getAccessKey()}/${encoded}/manifest.json`;
      document.getElementById('manifestUrl').textContent = manifestUrl;
      document.getElementById('result').classList.add('visible');
    });

    document.getElementById('copy').addEventListener('click', () => {
      const text = document.getElementById('manifestUrl').textContent;
      navigator.clipboard.writeText(text);
    });
  </script>
</body>
</html>
